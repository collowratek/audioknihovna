<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151b">
<title>Audioknihovna</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8a33d'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle'%3E%F0%9F%8E%A7%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#12151b; --panel:#1a1f28; --panel2:#222836; --line:#2c3444;
    --tx:#e9edf4; --dim:#98a2b6; --acc:#e8a33d; --acc-dim:#7a5a22;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:20;background:rgba(18,21,27,.94);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
  header h1{font-size:17px;margin:0;font-weight:650;flex:1;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:9px 14px;font-size:15px}
  .btn:active{background:var(--line)}
  .btn-acc{background:var(--acc);color:#1a1205;border-color:var(--acc);font-weight:650}
  main{padding:14px;max-width:820px;margin:0 auto}

  /* prihlaseni */
  .login{max-width:440px;margin:8vh auto;padding:0 16px}
  .login h2{margin:0 0 6px;font-size:22px}
  .login p{color:var(--dim);font-size:14px;margin:0 0 18px}
  input{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel);color:var(--tx);font:inherit;margin-bottom:12px}
  details{margin-top:20px;color:var(--dim);font-size:13.5px}
  details ol{padding-left:20px;line-height:1.7}
  code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:12.5px}

  /* knihovna */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;text-align:left;display:flex;flex-direction:column}
  .card:active{border-color:var(--acc-dim)}
  .cov{aspect-ratio:1;background:var(--panel2);display:flex;align-items:center;
    justify-content:center;font-size:34px;color:var(--line)}
  .cov img{width:100%;height:100%;object-fit:cover;display:block}
  .meta{padding:9px 10px 11px}
  .au{font-size:11.5px;color:var(--acc);text-transform:uppercase;letter-spacing:.4px;
    margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ti{font-size:13.5px;line-height:1.35;font-weight:600}
  .sub{font-size:11.5px;color:var(--dim);margin-top:5px}
  .bar{height:3px;background:var(--line);border-radius:2px;margin-top:7px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--acc)}

  /* detail */
  .head{display:flex;gap:14px;margin-bottom:18px}
  .head .cov{width:112px;height:112px;flex:0 0 112px;border-radius:12px}
  .head h2{margin:0 0 4px;font-size:19px;line-height:1.25}
  .head .a{color:var(--acc);font-size:13.5px;margin-bottom:8px}
  .tr{display:flex;align-items:center;gap:11px;padding:11px 10px;border-radius:10px;
    width:100%;text-align:left;border:1px solid transparent}
  .tr:active{background:var(--panel)}
  .tr.on{background:var(--panel);border-color:var(--acc-dim)}
  .tr .n{width:30px;text-align:right;color:var(--dim);font-size:13px;
    font-variant-numeric:tabular-nums;flex:0 0 30px}
  .tr .t{flex:1;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tr .d{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}
  .tr.done .t{color:var(--dim)}

  /* prehravac */
  .pl{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);
    border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    display:none}
  .pl.on{display:block}
  .pl .now{font-size:13px;color:var(--dim);margin-bottom:8px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .pl .now b{color:var(--tx);font-weight:600}
  .seek{width:100%;accent-color:var(--acc);margin:0 0 4px}
  .times{display:flex;justify-content:space-between;color:var(--dim);font-size:11.5px;
    font-variant-numeric:tabular-nums;margin-bottom:8px}
  .ctl{display:flex;align-items:center;justify-content:center;gap:8px}
  .ctl button{padding:8px 12px;border-radius:10px;font-size:15px}
  .ctl .play{background:var(--acc);color:#1a1205;width:54px;height:54px;border-radius:27px;
    font-size:21px;display:flex;align-items:center;justify-content:center}
  .rate{font-size:13px;color:var(--dim);min-width:38px}
  .empty{color:var(--dim);text-align:center;padding:40px 0}
  .err{background:#3a1d1d;border:1px solid #6b2f2f;color:#ffbcbc;padding:11px 13px;
    border-radius:11px;font-size:14px;margin-bottom:14px}
</style>
</head>
<body>

<div id="app"></div>

<div class="pl" id="pl">
  <div class="now" id="plNow"></div>
  <input type="range" class="seek" id="seek" min="0" max="1000" value="0">
  <div class="times"><span id="tCur">0:00</span><span id="tTot">0:00</span></div>
  <div class="ctl">
    <button class="btn" id="bRate">1×</button>
    <button class="btn" id="bPrev">⏮</button>
    <button class="btn" id="bBack">−30</button>
    <button class="play" id="bPlay">▶</button>
    <button class="btn" id="bFwd">+30</button>
    <button class="btn" id="bNext">⏭</button>
  </div>
</div>

<audio id="au" preload="metadata"></audio>

<script>
'use strict';
const API = 'https://webshare.cz/api/';
const ROOT = '/audioknihy';
const UUID = 'player-' + (localStorage.getItem('uuid') || (() => {
  const u = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
  localStorage.setItem('uuid', u); return u;
})());

let WST = localStorage.getItem('wst') || '';
const app = document.getElementById('app');
const au = document.getElementById('au');
const pl = document.getElementById('pl');

/* ---------- API ---------- */
async function api(ep, params) {
  const body = new URLSearchParams(Object.assign({ wst: WST }, params));
  const r = await fetch(API + ep + '/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body
  });
  const txt = await r.text();
  const doc = new DOMParser().parseFromString(txt, 'text/xml');
  const st = doc.querySelector('status')?.textContent;
  if (st !== 'OK') throw new Error(doc.querySelector('message')?.textContent || 'Chyba API');
  return doc;
}

async function listDir(path) {
  const out = [];
  let offset = 0;
  for (;;) {
    const doc = await api('files', {
      path, private: '1', sort_by: 'name', sort_order: 'asc',
      limit: '100', offset: String(offset), device_uuid: UUID
    });
    const items = [...doc.querySelectorAll('response > file, response > folder')];
    if (!items.length) break;
    for (const n of items) {
      out.push({
        kind: n.tagName,
        ident: n.querySelector('ident')?.textContent || '',
        name: n.querySelector('name')?.textContent || '',
        size: +(n.querySelector('size')?.textContent || 0)
      });
    }
    if (items.length < 100) break;
    offset += items.length;
  }
  return out;
}

async function fileLink(ident) {
  const doc = await api('file_link', {
    ident, download_type: 'file_download', device_uuid: UUID, force_https: '1'
  });
  return doc.querySelector('link')?.textContent || '';
}

/* ---------- stav ---------- */
const pos = {
  get(book) { try { return JSON.parse(localStorage.getItem('pos:' + book)) || null; } catch { return null; } },
  set(book, v) { localStorage.setItem('pos:' + book, JSON.stringify(v)); }
};
const coverCache = {};

function splitName(n) {
  const i = n.indexOf(' - ');
  return i > 0 ? { author: n.slice(0, i).replace(/,\s*/, ', '), title: n.slice(i + 3) }
               : { author: '', title: n };
}
function fmt(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), q = Math.floor(s % 60);
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(q).padStart(2, '0')}`
           : `${m}:${String(q).padStart(2, '0')}`;
}

/* ---------- prehravac ---------- */
let cur = null; // {book, tracks, idx}
const el = id => document.getElementById(id);

async function playTrack(idx, seekTo) {
  if (!cur || idx < 0 || idx >= cur.tracks.length) return;
  cur.idx = idx;
  const t = cur.tracks[idx];
  el('plNow').innerHTML = '<b>' + t.name.replace(/\.[^.]+$/, '') + '</b> — ' + splitName(cur.book).title;
  pl.classList.add('on');
  try {
    au.src = await fileLink(t.ident);
    if (seekTo) au.currentTime = seekTo;
    await au.play();
  } catch (e) {
    el('plNow').textContent = 'Nepodařilo se spustit: ' + e.message;
    return;
  }
  if (seekTo) {
    const once = () => { au.currentTime = seekTo; au.removeEventListener('loadedmetadata', once); };
    au.addEventListener('loadedmetadata', once);
  }
  save();
  if (cur.render) cur.render();
}
function save() {
  if (cur) pos.set(cur.book, { idx: cur.idx, time: au.currentTime || 0, n: cur.tracks.length });
}
au.addEventListener('timeupdate', () => {
  el('tCur').textContent = fmt(au.currentTime);
  el('tTot').textContent = fmt(au.duration);
  if (au.duration) el('seek').value = String(au.currentTime / au.duration * 1000);
  if (Math.floor(au.currentTime) % 5 === 0) save();
});
au.addEventListener('ended', () => playTrack(cur.idx + 1));
au.addEventListener('play', () => el('bPlay').textContent = '⏸');
au.addEventListener('pause', () => { el('bPlay').textContent = '▶'; save(); });
el('bPlay').onclick = () => au.paused ? au.play() : au.pause();
el('bNext').onclick = () => playTrack(cur.idx + 1);
el('bPrev').onclick = () => au.currentTime > 3 ? (au.currentTime = 0) : playTrack(cur.idx - 1);
el('bFwd').onclick = () => au.currentTime += 30;
el('bBack').onclick = () => au.currentTime -= 30;
el('seek').oninput = e => { if (au.duration) au.currentTime = au.duration * e.target.value / 1000; };
const RATES = [1, 1.25, 1.5, 1.75, 2, 0.75];
let ri = 0;
el('bRate').onclick = () => { ri = (ri + 1) % RATES.length; au.playbackRate = RATES[ri]; el('bRate').textContent = RATES[ri] + '×'; };

/* ---------- obrazovky ---------- */
function screenLogin(msg) {
  app.innerHTML = `<div class="login">
    <h2>Audioknihovna</h2>
    <p>Přístup k soukromému archivu na Webshare.</p>
    ${msg ? `<div class="err">${msg}</div>` : ''}
    <input id="tok" placeholder="Přihlašovací token (wst)" autocomplete="off"
      autocapitalize="off" spellcheck="false">
    <button class="btn btn-acc" id="go" style="width:100%">Vstoupit</button>
    <details><summary>Kde token vezmu?</summary><ol>
      <li>Na počítači se přihlas na <code>webshare.cz</code></li>
      <li>Otevři vývojářské nástroje (F12) → záložka <code>Application</code> → <code>Cookies</code></li>
      <li>Zkopíruj hodnotu cookie <code>wst</code></li>
    </ol><p>Token se uloží jen do tohoto zařízení a nikam se neodesílá.</p></details>
  </div>`;
  const go = () => {
    const v = el('tok').value.trim();
    if (!v) return;
    WST = v; localStorage.setItem('wst', v); screenLibrary();
  };
  el('go').onclick = go;
  el('tok').onkeydown = e => { if (e.key === 'Enter') go(); };
}

async function screenLibrary() {
  app.innerHTML = `<header><h1>Audioknihovna</h1>
    <button class="btn" id="out">Odhlásit</button></header>
    <main><div class="empty">Načítám…</div></main>`;
  el('out').onclick = () => { localStorage.removeItem('wst'); WST = ''; au.pause(); pl.classList.remove('on'); screenLogin(); };
  let books;
  try {
    books = (await listDir(ROOT)).filter(x => x.kind === 'folder');
  } catch (e) {
    return screenLogin('Přihlášení selhalo: ' + e.message);
  }
  if (!books.length) return app.querySelector('main').innerHTML = '<div class="empty">Knihovna je prázdná.</div>';

  const cards = books.map(b => {
    const { author, title } = splitName(b.name);
    const p = pos.get(b.name);
    const prog = p && p.n ? Math.round((p.idx + 1) / p.n * 100) : 0;
    return `<button class="card" data-n="${encodeURIComponent(b.name)}">
      <div class="cov" data-cov="${encodeURIComponent(b.name)}">🎧</div>
      <div class="meta">
        ${author ? `<div class="au">${author}</div>` : ''}
        <div class="ti">${title}</div>
        ${prog ? `<div class="sub">rozposloucháno ${prog} %</div><div class="bar"><i style="width:${prog}%"></i></div>` : ''}
      </div></button>`;
  }).join('');
  app.querySelector('main').innerHTML = `<div class="grid">${cards}</div>`;
  app.querySelectorAll('.card').forEach(c =>
    c.onclick = () => screenBook(decodeURIComponent(c.dataset.n)));

  // obálky po třech, ať se na mobilu nezahltí spojení a stránka zůstane svižná
  (async () => {
    const q = books.slice();
    const worker = async () => { while (q.length) await loadCover(q.shift().name); };
    await Promise.all([worker(), worker(), worker()]);
  })();
}

async function loadCover(book) {
  const box = document.querySelector(`[data-cov="${CSS.escape(encodeURIComponent(book))}"]`);
  if (!box) return;
  try {
    if (!coverCache[book]) {
      const f = (await listDir(ROOT + '/' + book))
        .find(x => /^cover\.(jpg|jpeg|png)$/i.test(x.name));
      if (!f) return;
      coverCache[book] = await fileLink(f.ident);
    }
    box.innerHTML = `<img src="${coverCache[book]}" alt="">`;
  } catch { /* obálka je bonus, ne nutnost */ }
}

async function screenBook(book) {
  const { author, title } = splitName(book);
  app.innerHTML = `<header><button class="btn" id="back">‹</button><h1>${title}</h1></header>
    <main><div class="empty">Načítám…</div></main>`;
  el('back').onclick = screenLibrary;

  let files;
  try {
    files = (await listDir(ROOT + '/' + book))
      .filter(x => x.kind === 'file' && /\.(mp3|m4a|m4b|wav|ogg|opus)$/i.test(x.name))
      .sort((a, b2) => a.name.localeCompare(b2.name, 'cs', { numeric: true }));
  } catch (e) {
    return app.querySelector('main').innerHTML = `<div class="err">${e.message}</div>`;
  }
  if (!files.length) return app.querySelector('main').innerHTML = '<div class="empty">Žádné zvukové soubory.</div>';

  const p = pos.get(book);
  cur = { book, tracks: files, idx: p ? p.idx : 0, render: null };

  const draw = () => {
    const rows = files.map((f, i) => `<button class="tr ${i === cur.idx ? 'on' : ''} ${p && i < (p.idx || 0) ? 'done' : ''}" data-i="${i}">
        <span class="n">${i + 1}</span>
        <span class="t">${f.name.replace(/\.[^.]+$/, '')}</span>
        <span class="d">${(f.size / 1048576).toFixed(0)} MB</span></button>`).join('');
    app.querySelector('main').innerHTML = `
      <div class="head">
        <div class="cov" style="border-radius:12px">${coverCache[book] ? `<img src="${coverCache[book]}" alt="">` : '🎧'}</div>
        <div><h2>${title}</h2>${author ? `<div class="a">${author}</div>` : ''}
        <div class="sub">${files.length} stop</div>
        <button class="btn btn-acc" id="res" style="margin-top:10px">
          ${p ? 'Pokračovat' : 'Přehrát'}</button></div>
      </div>${rows}`;
    el('res').onclick = () => playTrack(cur.idx, p && p.idx === cur.idx ? p.time : 0);
    app.querySelectorAll('.tr').forEach(r => r.onclick = () => playTrack(+r.dataset.i, 0));
  };
  cur.render = draw;
  draw();
  if (!coverCache[book]) { await loadCover(book); draw(); }
}

/* ---------- start ---------- */
window.addEventListener('beforeunload', save);
WST ? screenLibrary() : screenLogin();
</script>
</body>
</html>
